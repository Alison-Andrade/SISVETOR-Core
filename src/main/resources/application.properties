spring.application.name=endemias

spring.datasource.url=jdbc:postgresql://localhost:5432/endemias
spring.datasource.username=postgres
spring.datasource.password=manager

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
bootstrap.coordinator.enabled=${BOOTSTRAP_COORDINATOR_ENABLED:false}
auth.web.allowed-origins=${AUTH_WEB_ALLOWED_ORIGINS:}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
management.endpoints.web.base-path=/api/v1/actuator
management.endpoints.web.exposure.include=health
